<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 940" width="1160" height="940" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arwD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <rect width="1160" height="940" fill="#ffffff"/>

  <text x="40" y="36" font-size="21" font-weight="700" fill="#1a202c">agentgateway 拓扑架构</text>
  <text x="40" y="60" font-size="13.5" fill="#718096">单进程数据平面承载四类流量；推理端点选择与语义缓存委托给外部组件</text>

  <!-- ============ 控制平面 ============ -->
  <rect x="40" y="82" width="1080" height="146" rx="10" fill="#eef2f7" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="62" y="108" font-size="14" font-weight="700" fill="#4a5568">Kubernetes 控制平面（Go）</text>

  <rect x="80" y="122" width="272" height="84" rx="7" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="216" y="150" font-size="14.5" font-weight="600" fill="#2d3748" text-anchor="middle">krt collections</text>
  <text x="216" y="172" font-size="12" fill="#718096" text-anchor="middle">响应式集合（Istio 第三方库）</text>
  <text x="216" y="190" font-size="12" fill="#718096" text-anchor="middle">watch Gateway API / CRD</text>

  <rect x="444" y="122" width="272" height="84" rx="7" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="580" y="150" font-size="14.5" font-weight="600" fill="#2d3748" text-anchor="middle">xDS server</text>
  <text x="580" y="172" font-size="12" fill="#718096" text-anchor="middle">ADS 流式 + delta 增量</text>
  <text x="580" y="190" font-size="12" fill="#718096" text-anchor="middle">SA Token 认证 + TLS</text>

  <rect x="808" y="122" width="272" height="84" rx="7" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="944" y="150" font-size="14.5" font-weight="600" fill="#2d3748" text-anchor="middle">Deployer</text>
  <text x="944" y="172" font-size="12" fill="#718096" text-anchor="middle">自动 provision 代理工作负载</text>
  <text x="944" y="190" font-size="12" fill="#718096" text-anchor="middle">Deployment / DaemonSet</text>

  <line x1="352" y1="164" x2="440" y2="164" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="716" y1="164" x2="804" y2="164" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- 控制平面 → 数据平面 -->
  <line x1="580" y1="228" x2="580" y2="288" stroke="#2b6cb0" stroke-width="2.4" marker-end="url(#arwG)"/>
  <rect x="602" y="241" width="232" height="34" rx="5" fill="#ebf4ff" stroke="#90cdf4" stroke-width="1"/>
  <text x="718" y="256" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">xDS 下发</text>
  <text x="718" y="270" font-size="11.5" fill="#4a5568" text-anchor="middle">自研资源类型，非 Envoy 类型</text>

  <!-- ============ 数据平面 ============ -->
  <rect x="40" y="296" width="1080" height="338" rx="10" fill="#ebf4ff" stroke="#90cdf4" stroke-width="2"/>
  <text x="62" y="322" font-size="14" font-weight="700" fill="#2b6cb0">agentgateway 数据平面（Rust，单进程）</text>

  <rect x="80" y="336" width="1000" height="46" rx="6" fill="#ffffff" stroke="#90cdf4" stroke-width="1.3"/>
  <text x="580" y="355" font-size="13" font-weight="600" fill="#2d3748" text-anchor="middle">IR = Arc&lt;RwLock&lt;Store&gt;&gt;</text>
  <text x="580" y="373" font-size="11.5" fill="#718096" text-anchor="middle">写锁下逐条增量应用，非快照原子替换 · 三种配置来源（Static / Local / xDS）归一到同一 IR</text>

  <!-- 四类流量 -->
  <rect x="80" y="402" width="235" height="76" rx="7" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="197" y="429" font-size="14.5" font-weight="700" fill="#2b6cb0" text-anchor="middle">LLM Gateway</text>
  <text x="197" y="449" font-size="11.5" fill="#4a5568" text-anchor="middle">7 家 provider + custom</text>
  <text x="197" y="465" font-size="11.5" fill="#4a5568" text-anchor="middle">OpenAI 兼容 + 各家原生端点</text>

  <rect x="335" y="402" width="235" height="76" rx="7" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="452" y="429" font-size="14.5" font-weight="700" fill="#2b6cb0" text-anchor="middle">MCP Gateway</text>
  <text x="452" y="449" font-size="11.5" fill="#4a5568" text-anchor="middle">工具联邦 · 会话管理</text>
  <text x="452" y="465" font-size="11.5" fill="#4a5568" text-anchor="middle">OAuth（RFC 9728/8414/7591）</text>

  <rect x="590" y="402" width="235" height="76" rx="7" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="707" y="429" font-size="14.5" font-weight="700" fill="#2b6cb0" text-anchor="middle">A2A Gateway</text>
  <text x="707" y="449" font-size="11.5" fill="#4a5568" text-anchor="middle">Agent Card 重写</text>
  <text x="707" y="465" font-size="11.5" fill="#4a5568" text-anchor="middle">JSON-RPC 解析用于可观测</text>

  <rect x="845" y="402" width="235" height="76" rx="7" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="962" y="429" font-size="14.5" font-weight="700" fill="#2b6cb0" text-anchor="middle">HTTP / gRPC</text>
  <text x="962" y="449" font-size="11.5" fill="#4a5568" text-anchor="middle">传统南北向 / 东西向</text>
  <text x="962" y="465" font-size="11.5" fill="#4a5568" text-anchor="middle">TLS · OIDC · mTLS 轮换</text>

  <!-- 网关 → 共享层（短连接） -->
  <line x1="197" y1="478" x2="197" y2="508" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#arwG)"/>
  <line x1="452" y1="478" x2="452" y2="508" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#arwG)"/>
  <line x1="707" y1="478" x2="707" y2="508" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#arwG)"/>
  <line x1="962" y1="478" x2="962" y2="508" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#arwG)"/>

  <!-- 共享层 -->
  <rect x="80" y="512" width="1000" height="58" rx="7" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="580" y="536" font-size="13" font-weight="700" fill="#2d3748" text-anchor="middle">四类流量共享同一套：策略 · 身份 · 观测 · 成本</text>
  <text x="580" y="557" font-size="11.5" fill="#718096" text-anchor="middle">CEL 策略引擎（fork 自 cel-rust）· SPIFFE / 令牌交换 / ID-JAG / AuthZEN · OTel 指标与追踪 · 按 Key 的 USD / Tokens 预算</text>

  <!-- 共享层 → 上游 -->
  <line x1="197" y1="572" x2="197" y2="690" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="452" y1="572" x2="452" y2="690" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="707" y1="572" x2="707" y2="690" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="962" y1="572" x2="962" y2="690" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arw)"/>

  <text x="580" y="606" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">MCP 会话状态随加密令牌走，任意副本可恢复 · 无外部存储依赖</text>

  <!-- ============ 上游 ============ -->
  <rect x="80" y="694" width="235" height="88" rx="7" fill="#f0fff4" stroke="#68d391" stroke-width="1.6"/>
  <text x="197" y="722" font-size="13.5" font-weight="600" fill="#22543d" text-anchor="middle">LLM 上游</text>
  <text x="197" y="743" font-size="11.5" fill="#276749" text-anchor="middle">OpenAI / Anthropic / Bedrock</text>
  <text x="197" y="760" font-size="11.5" fill="#276749" text-anchor="middle">Gemini / Vertex / Azure / Copilot</text>

  <rect x="335" y="694" width="235" height="88" rx="7" fill="#f0fff4" stroke="#68d391" stroke-width="1.6"/>
  <text x="452" y="722" font-size="13.5" font-weight="600" fill="#22543d" text-anchor="middle">MCP 服务器</text>
  <text x="452" y="743" font-size="11.5" fill="#276749" text-anchor="middle">Stdio / SSE</text>
  <text x="452" y="760" font-size="11.5" fill="#276749" text-anchor="middle">Streamable HTTP / OpenAPI</text>

  <rect x="590" y="694" width="235" height="88" rx="7" fill="#f0fff4" stroke="#68d391" stroke-width="1.6"/>
  <text x="707" y="722" font-size="13.5" font-weight="600" fill="#22543d" text-anchor="middle">A2A Agent</text>
  <text x="707" y="743" font-size="11.5" fill="#276749" text-anchor="middle">能力发现 · 模态协商</text>
  <text x="707" y="760" font-size="11.5" fill="#276749" text-anchor="middle">任务协作</text>

  <rect x="845" y="694" width="235" height="88" rx="7" fill="#f0fff4" stroke="#68d391" stroke-width="1.6"/>
  <text x="962" y="722" font-size="13.5" font-weight="600" fill="#22543d" text-anchor="middle">传统后端</text>
  <text x="962" y="743" font-size="11.5" fill="#276749" text-anchor="middle">HTTP / gRPC 服务</text>
  <text x="962" y="760" font-size="11.5" fill="#276749" text-anchor="middle">TCP 南北向与东西向</text>

  <!-- ============ 委托（走中缝，不穿过任何方框） ============ -->
  <line x1="580" y1="634" x2="580" y2="812" stroke="#b7791f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arwD)"/>
  <rect x="488" y="641" width="184" height="26" rx="5" fill="#fffaf0" stroke="#d69e2e" stroke-width="1"/>
  <text x="580" y="658" font-size="11.5" font-weight="600" fill="#975a16" text-anchor="middle">经 gRPC ext_proc 接入</text>

  <rect x="40" y="822" width="1080" height="104" rx="10" fill="#fffaf0" stroke="#d69e2e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="62" y="848" font-size="13.5" font-weight="700" fill="#975a16">委托出去 —— 不在网关内实现</text>

  <rect x="150" y="860" width="360" height="52" rx="7" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="330" y="882" font-size="13" font-weight="600" fill="#744210" text-anchor="middle">EPP（Endpoint Picker）</text>
  <text x="330" y="900" font-size="11.5" fill="#975a16" text-anchor="middle">推理端点选择 · 只返回 ip:port</text>

  <rect x="650" y="860" width="360" height="52" rx="7" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="830" y="882" font-size="13" font-weight="600" fill="#744210" text-anchor="middle">vSR（vLLM Semantic Router）</text>
  <text x="830" y="900" font-size="11.5" fill="#975a16" text-anchor="middle">语义缓存与语义路由 · 缓存键在 vSR 侧</text>
</svg>
